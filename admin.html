<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Undangan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF1E6;--surface:#FFF9F2;--ink:#3E2A22;--muted:#6E5649;--gold:#9A4A26;--line:#E8D2BC;--danger:#A3261A}
@media (prefers-color-scheme:dark){:root{--bg:#1F1511;--surface:#2A1D17;--ink:#F6E7D8;--muted:#C9AE9A;--gold:#E8B77A;--line:#4A3429;--danger:#FF9A8C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.6 'Jost',system-ui,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:24px 18px 64px}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
h1{font-size:34px}h2{font-size:26px;margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--gold);background:transparent;color:var(--gold);font:400 13px 'Jost',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.solid{background:var(--gold);color:var(--bg)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);padding:20px;margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--line);padding:16px}
.stat b{display:block;font:600 34px 'Cormorant Garamond',serif;line-height:1.1;color:var(--gold)}
.stat span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
label{display:grid;gap:4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:300 15px 'Jost',sans-serif;border-radius:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.row{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:6px}
.row.off{opacity:.6}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.top b{font:600 20px 'Cormorant Garamond',serif}
.chip{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.meta{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.msg{min-height:1.6em;margin-top:10px;font-size:14px}
#login{max-width:380px;margin:12vh auto 0}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="card">
  <h1>Admin</h1>
  <p class="meta">Masukkan kata sandi admin untuk mengelola undangan.</p>
  <label style="margin-top:14px">Kata sandi<input id="pw" type="password" autocomplete="current-password"></label>
  <p style="margin-top:14px"><button class="btn solid" id="go" type="button">Masuk</button></p>
  <p class="msg" id="lmsg" role="status"></p>
</section>

<div id="app" hidden>
  <div class="bar">
    <h1>Admin Undangan</h1>
    <div class="acts">
      <a class="btn" href="./" target="_blank" rel="noopener">Lihat undangan</a>
      <a class="btn" id="exportBtn" href="/admin/export.csv">Ekspor CSV</a>
      <button class="btn" id="out" type="button">Keluar</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>Konfirmasi &amp; Ucapan</h2>
    <label>Cari nama atau ucapan<input id="q" type="search"></label>
    <div id="list"></div>
  </div>

  <div class="card">
    <h2>Pengaturan Undangan</h2>
    <p class="meta">Kosongkan kolom untuk kembali ke isian bawaan. Perubahan tampil di undangan setelah halaman dimuat ulang.</p>
    <div class="grid" id="fields" style="margin-top:14px"></div>
    <p style="margin-top:16px"><button class="btn solid" id="save" type="button">Simpan pengaturan</button></p>
    <p class="msg" id="smsg" role="status"></p>
  </div>
</div>
</div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var D=null,built=false;
var LK_WISH='undangan-ucapan', LK_SET='undangan-settings', ADM_PW='admin123';
var GAS_URL='https://script.google.com/macros/s/AKfycbyNBEjQi-ZImei-vSHx-_7XrW4SL-_l31EmdwB-bKlZ5hp_XtvkZlU71qT9ZVknu1XQSA/exec';
var DEFAULTS = {
  theme: "batik_bunga",
  pria: "Raka", wanita: "Anindya",
  pria_lengkap: "Raka Pratama", wanita_lengkap: "Anindya Putri",
  ortu_pria: "Putra dari Bapak Hendra Pratama\n& Ibu Sari Wulandari",
  ortu_wanita: "Putri dari Bapak Bambang Setiawan\n& Ibu Ratna Dewi",
  tanggal: "2027-03-20T08:00", rsvp_batas: "2027-03-10",
  akad_jam: "08.00 – 10.00 WIB", resepsi_jam: "11.00 – 14.00 WIB",
  venue: "Gedung Serbaguna Melati",
  alamat: "Jl. Kenanga Raya No. 12, Menteng,\nJakarta Pusat 10310",
  maps: "https://maps.google.com/?q=Jakarta",
  bank: "Bank BCA · a.n. Raka Pratama", rekening: "1234 5678 90"
};

var isStaticMode = (window.location.hostname.indexOf('github.io') !== -1);
if (sessionStorage.getItem('adm_static') === '1') isStaticMode = true;

function getLocalData() {
  var wishes = [];
  try { wishes = JSON.parse(localStorage.getItem(LK_WISH) || '[]'); } catch(e){}
  wishes = wishes.map(function(item, idx){
    return {
      id: item.id || (idx + 1),
      nama: item.nama || '',
      status: item.status || 'Hadir',
      jumlah: item.jumlah || 1,
      ucapan: item.ucapan || '',
      tampil: item.tampil !== undefined ? item.tampil : 1,
      created_at: item.created_at || new Date().toISOString()
    };
  });
  var settings = Object.assign({}, DEFAULTS);
  try {
    var saved = JSON.parse(localStorage.getItem(LK_SET) || '{}');
    Object.assign(settings, saved);
  } catch(e){}
  return { wishes: wishes, settings: settings };
}

function handleStaticApi(m, u, b) {
  if (u === '/admin/api/login') {
    if (b && b.password === ADM_PW) {
      sessionStorage.setItem('adm_static', '1');
      isStaticMode = true;
      return Promise.resolve({ ok: true });
    }
    return Promise.reject(new Error('Kata sandi salah.'));
  }
  if (u === '/admin/api/logout') {
    sessionStorage.removeItem('adm_static');
    return Promise.resolve({ ok: true });
  }
  if (u === '/admin/api/data') {
    return fetch(GAS_URL).then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(wishes){
        var settings = Object.assign({}, DEFAULTS);
        try {
          var saved = JSON.parse(localStorage.getItem(LK_SET) || '{}');
          Object.assign(settings, saved);
        } catch(e){}
        return {
          wishes: wishes.map(function(item, idx){
            return {
              id: item.id || (idx + 1),
              nama: item.nama || '',
              status: item.status || 'Hadir',
              jumlah: item.jumlah || 1,
              ucapan: item.ucapan || '',
              tampil: item.tampil !== undefined ? item.tampil : 1,
              created_at: item.created_at || new Date().toISOString()
            };
          }),
          settings: settings
        };
      })
      .catch(function(){
        return getLocalData();
      });
  }
  if (u === '/admin/api/wish') {
    var data = getLocalData();
    if (b.action === 'toggle') {
      data.wishes.forEach(function(w){ if (w.id === b.id) w.tampil = w.tampil ? 0 : 1; });
    } else if (b.action === 'delete') {
      data.wishes = data.wishes.filter(function(w){ return w.id !== b.id; });
    }
    localStorage.setItem(LK_WISH, JSON.stringify(data.wishes));
    return Promise.resolve({ ok: true });
  }
  if (u === '/admin/api/settings') {
    localStorage.setItem(LK_SET, JSON.stringify(b));
    return Promise.resolve({ ok: true });
  }
  return Promise.resolve({ ok: true });
}

var F=[
  ['theme', 'Tema & Desain Undangan', 'select', [
    ['batik_bunga', '🌸 Batik Bunga Nusantara (Maroon Elegan & Emas)'],
    ['jawa_klasik', '🏛️ Batik Klasik Sogan (Cokelat Keraton & Emas)'],
    ['floral_romantis', '🌹 Bunga Romantis (Dusty Rose & Blush Gold)'],
    ['emerald_gold', '🌿 Emerald Botanical (Hijau Zamrud & Emas Mewah)'],
    ['warm', '🍂 Hangat Terracotta (Bata & Krem Klasik)']
  ]],
  ['pria','Nama panggilan pria'],['wanita','Nama panggilan wanita'],['pria_lengkap','Nama lengkap pria'],['wanita_lengkap','Nama lengkap wanita'],
  ['ortu_pria','Orang tua pria (2 baris)','ta'],['ortu_wanita','Orang tua wanita (2 baris)','ta'],['tanggal','Tanggal & jam akad (WIB)','datetime-local'],['rsvp_batas','Batas konfirmasi','date'],
  ['akad_jam','Jam akad nikah'],['resepsi_jam','Jam resepsi'],['venue','Nama tempat'],['alamat','Alamat (2 baris)','ta'],['maps','Link Google Maps (https://)','url'],['bank','Bank & nama pemilik'],['rekening','Nomor rekening']
];

function api(m,u,b){
  if (isStaticMode) {
    return handleStaticApi(m, u, b);
  }
  return fetch(u,{method:m,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Admin':'1'},body:b?JSON.stringify(b):undefined})
  .then(function(r){
    if(r.status===401&&u!=='/admin/api/login'){show(false);throw new Error('auth')}
    return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Gagal');return d});
  })
  .catch(function(err){
    if (u === '/admin/api/login') {
      if (b && b.password === ADM_PW) {
        isStaticMode = true;
        sessionStorage.setItem('adm_static', '1');
        return { ok: true };
      }
      throw new Error('Kata sandi salah.');
    }
    if (sessionStorage.getItem('adm_static') === '1') {
      isStaticMode = true;
      return handleStaticApi(m, u, b);
    }
    throw err;
  });
}
function show(on){$('#login').hidden=on;$('#app').hidden=!on}
function load(){return api('GET','/admin/api/data').then(function(d){D=d;show(true);render()}).catch(function(e){if(e.message!=='auth')$('#lmsg').textContent=e.message})}
function fmt(s){var d=new Date(s.replace(' ','T')+'Z');return isNaN(d)?s:d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function render(){
  var w=D.wishes,hadir=0,tdk=0,uc=0;
  w.forEach(function(i){if(i.status==='Hadir')hadir+=i.jumlah;else tdk++;if(i.ucapan&&i.tampil)uc++});
  var st=$('#stats');st.textContent='';
  [['Konfirmasi masuk',w.length],['Tamu hadir',hadir],['Berhalangan',tdk],['Ucapan tampil',uc]].forEach(function(x){
    var d=el('div','stat');d.appendChild(el('b',null,x[1]));d.appendChild(el('span',null,x[0]));st.appendChild(d)});
  var q=$('#q').value.trim().toLowerCase(),l=$('#list');l.textContent='';
  var items=w.filter(function(i){return !q||(i.nama+' '+i.ucapan).toLowerCase().indexOf(q)>-1});
  if(!items.length)l.appendChild(el('p','meta','Belum ada data.'));
  items.forEach(function(i){
    var r=el('div','row'+(i.tampil?'':' off')),t=el('div','top');
    t.appendChild(el('b',null,i.nama));t.appendChild(el('span','chip',i.status+' \u00B7 '+i.jumlah+' orang'));
    if(!i.tampil)t.appendChild(el('span','chip','Disembunyikan'));
    r.appendChild(t);
    if(i.ucapan)r.appendChild(el('div',null,i.ucapan));
    r.appendChild(el('div','meta',fmt(i.created_at)));
    var a=el('div','acts');
    var b1=el('button','btn sm',i.tampil?'Sembunyikan':'Tampilkan');b1.type='button';
    b1.onclick=function(){api('POST','/admin/api/wish',{id:i.id,action:'toggle'}).then(load)};
    var b2=el('button','btn sm danger','Hapus');b2.type='button';
    b2.onclick=function(){if(confirm('Hapus data '+i.nama+' secara permanen?'))api('POST','/admin/api/wish',{id:i.id,action:'delete'}).then(load)};
    a.appendChild(b1);a.appendChild(b2);r.appendChild(a);l.appendChild(r);
  });
  if(!built){
    built=true;var f=$('#fields');
    F.forEach(function(x){
      var lb=el('label',null,x[1]), inp;
      if(x[2]==='select'){
        inp=el('select');
        x[3].forEach(function(opt){
          var o=el('option',null,opt[1]);
          o.value=opt[0];
          inp.appendChild(o);
        });
      } else if(x[2]==='ta'){
        inp=el('textarea');
      } else {
        inp=el('input');
        if(x[2])inp.type=x[2];
      }
      inp.id='f_'+x[0];
      inp.value=D.settings[x[0]]||(x[2]==='select'?x[3][0][0]:'');
      lb.appendChild(inp);f.appendChild(lb);
    });
  }
}
$('#q').addEventListener('input',function(){if(D)render()});
$('#go').onclick=function(){
  $('#lmsg').textContent='Memeriksa\u2026';
  api('POST','/admin/api/login',{password:$('#pw').value}).then(function(){$('#lmsg').textContent='';$('#pw').value='';return load()}).catch(function(e){$('#lmsg').textContent=e.message});
};
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('#go').click()});
$('#out').onclick=function(){api('POST','/admin/api/logout',{}).then(function(){built=false;$('#fields').textContent='';show(false)})};
$('#save').onclick=function(){
  var b={};F.forEach(function(x){b[x[0]]=$('#f_'+x[0]).value});
  $('#smsg').textContent='Menyimpan\u2026';
  api('POST','/admin/api/settings',b).then(function(){$('#smsg').textContent='Tersimpan. Muat ulang halaman undangan untuk melihat perubahan.';return load()}).catch(function(e){$('#smsg').textContent=e.message});
};
var exp = $('#exportBtn');
if (exp) {
  exp.addEventListener('click', function(e){
    if (isStaticMode) {
      e.preventDefault();
      var data = getLocalData();
      var csv = "ID,Nama,Status,Jumlah,Ucapan,Waktu\n";
      data.wishes.forEach(function(w){
        csv += [w.id, '"'+(w.nama||'').replace(/"/g, '""')+'"', w.status, w.jumlah, '"'+(w.ucapan||'').replace(/"/g, '""')+'"', w.created_at].join(",") + "\n";
      });
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "undangan_wishes.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  });
}
load();
})();
</script>
</body>
</html>
